<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryMaker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</head>
<body>
    <div id="loading-overlay" class="d-flex justify-content-center align-items-center vh-100 bg-dark bg-opacity-75 position-fixed w-100 h-100 top-0 start-0 d-none" style="z-index: 9999;">
        <div id="status" class="text-white fs-3 text-center"></div>
    </div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                                    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                                    <div id="game-container" class="card shadow-lg p-4">                    <h1 class="text-center mb-4 text-primary fw-bold">StoryMaker</h1>
                    <div class="alert alert-info text-center" role="alert">
                        <strong>How to Play:</strong> Enter your part of the story in the text area and click 'Add to Story'. The AI will then continue the narrative!
                    </div>
                    <textarea id="story-area" class="form-control mb-3" style="min-height: 200px;" readonly></textarea>
                    <div class="d-flex justify-content-end mt-2 mb-3">
                        <button id="edit-btn" class="btn btn-secondary me-2"><i class="bi bi-pencil"></i></button>
                        <button id="save-btn" class="btn btn-success me-2 d-none"><i class="bi bi-save"></i></button>
                        <button id="copy-btn" class="btn btn-secondary me-2"><i class="bi bi-clipboard"></i></button>
                        <button id="reset-btn" class="btn btn-danger"><i class="bi bi-arrow-counterclockwise"></i></button>
                    </div>
                    <div class="d-flex mb-3">
                        <div id="user-input-wrapper" class="flex-grow-1 me-2">
                            <textarea id="user-input" class="form-control pe-3 flex-grow-1" placeholder="Continue the story..." rows="3"></textarea>
                        </div>
                        <div id="submit-btn-wrapper">
                            <button id="submit-btn" class="btn btn-primary"><i class="bi bi-send"></i></button>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
