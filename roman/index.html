<script>
"use strict";
/* ============================================================
   RELIC HUNTER OF ROME
   A mobile-first Roman-numeral puzzle game for grades 4–6.
   Modules:
     1. RomanEngine  — bidirectional converter + strict validator
     2. Levels       — infinite difficulty scaling + RNG targets
     3. Store        — LocalStorage persistence
     4. Hints        — 3-try scaffolding message builder
     5. Game         — state machine, UI rendering, events
   ============================================================ */

/* ============================================================
   1. ROMAN ENGINE — conversion + strict rule validation
   ============================================================ */
const RomanEngine = (() => {

  // Value map for single symbols
  const VALUES = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };

  // Greedy table for Arabic -> Roman (standard form)
  const TABLE = [
    [1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],
    [100,"C"],[90,"XC"],[50,"L"],[40,"XL"],
    [10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]
  ];

  /** Convert an Arabic number (1–3999) to its standard Roman numeral. */
  function toRoman(num){
    let out = "", n = num;
    for (const [val, sym] of TABLE){
      while (n >= val){ out += sym; n -= val; }
    }
    return out;
  }

  // Strict standard-form Roman numeral pattern (rejects IIII, VX, IC, etc.)
  const STRICT = /^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;

  /** True only if the string is a valid STANDARD Roman numeral. */
  function isValidRoman(str){
    return str.length > 0 && STRICT.test(str);
  }

  /**
   * Convert Roman -> Arabic using subtractive-pair rules.
   * Works even on non-strict strings (used for live feedback),
   * returning the naive left-to-right value.
   */
  function toArabic(str){
    let total = 0;
    for (let i = 0; i < str.length; i++){
      const cur = VALUES[str[i]], next = VALUES[str[i+1]] || 0;
      total += (cur < next) ? -cur : cur;
    }
    return total;
  }

  /**
   * Tokenize a Roman string into display chunks:
   * subtractive pairs stay together (XL), runs of a repeated
   * additive symbol merge (III). Returns [{roman, value}, ...]
   */
  function tokenize(str){
    const tokens = [];
    let i = 0;
    while (i < str.length){
      const cur = str[i], next = str[i+1];
      // Subtractive pair?
      if (next && VALUES[cur] < VALUES[next]){
        tokens.push({ roman: cur + next, value: VALUES[next] - VALUES[cur] });
        i += 2;
      } else {
        // Merge run of the same symbol (III => one token of 3)
        let run = cur, j = i + 1;
        while (j < str.length && str[j] === cur){ run += cur; j++; }
        tokens.push({ roman: run, value: toArabic(run) });
        i = j;
      }
    }
    return tokens;
  }

  /**
   * Diagnose WHY a string breaks strict rules.
   * Returns a machine-readable code used by the hint system:
   *  'repeat'      — a symbol repeated 4+ times (IIII)
   *  'repeatVLD'   — V, L, or D repeated (VV)
   *  'badPair'     — illegal subtractive pair (IL, VX, IC…)
   *  'order'       — otherwise malformed ordering (XXC, IXI…)
   *  null          — string is valid
   */
  function diagnose(str){
    if (isValidRoman(str)) return null;
    if (/(.)\1\1\1/.test(str))       return "repeat";
    if (/V.*V|L.*L|D.*D/.test(str))  return "repeatVLD";
    // Check each adjacent pair for illegal subtraction
    const LEGAL_PAIRS = ["IV","IX","XL","XC","CD","CM"];
    for (let i = 0; i < str.length - 1; i++){
      const a = str[i], b = str[i+1];
      if (VALUES[a] < VALUES[b] && !LEGAL_PAIRS.includes(a + b)) return "badPair";
    }
    return "order";
  }

  return { VALUES, toRoman, toArabic, isValidRoman, tokenize, diagnose };
})();

/* ============================================================
   2. LEVELS — infinite generation with scaled difficulty
   ============================================================ */
const Levels = (() => {

  /** Inclusive random integer. */
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  /** Difficulty band for a given level number. */
  function band(level){
    if (level <= 5)  return { min:1,   max:20,   symbols:["I","V","X"] };
    if (level <= 15) return { min:21,  max:99,   symbols:["I","V","X","L"] };
    if (level <= 30) return { min:100, max:499,  symbols:["I","V","X","L","C"] };
    return             { min:100, max:1000, symbols:["I","V","X","L","C","D","M"] };
  }

  /** Generate a fresh random target for a level. */
  function generateTarget(level){
    const b = band(level);
    return rand(b.min, b.max);
  }

  /** Which tile symbols are unlocked at this level. */
  function unlockedSymbols(level){
    return band(level).symbols;
  }

  return { generateTarget, unlockedSymbols };
})();

/* ============================================================
   3. STORE — LocalStorage persistence
   ============================================================ */
const Store = (() => {
  const KEY = "relicHunterRome_v1";

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      // Basic sanity check
      if (typeof d.level !== "number" || d.level < 1) return null;
      return d;
    } catch(e){ return null; }
  }

  function save(state){
    try {
      localStorage.setItem(KEY, JSON.stringify({
        level:     state.level,
        artifacts: state.artifacts,
        target:    state.target,   // persist current puzzle too
        tries:     state.tries
      }));
    } catch(e){ /* storage unavailable — play without saving */ }
  }

  return { load, save };
})();

/* ============================================================
   4. HINTS — 3-try scaffolding message builder
   ============================================================ */
const Hints = (() => {
  const R = RomanEngine;

  /** Kid-friendly explanation of a rule violation code. */
  const RULE_TEXT = {
    repeat:    "Ancient Romans <b>never repeated a symbol more than 3 times</b> — no <span class='rn'>IIII</span>! When you need a 4 or a 9, use <b>subtraction</b>: put a smaller symbol <i>before</i> a bigger one, like <span class='rn'>IV</span> (4) or <span class='rn'>IX</span> (9).",
    repeatVLD: "The symbols <span class='rn'>V</span>, <span class='rn'>L</span>, and <span class='rn'>D</span> are special — Romans <b>never repeated them</b>. Instead of <span class='rn'>VV</span>, they wrote <span class='rn'>X</span>!",
    badPair:   "Careful! Only certain subtraction pairs are allowed: <span class='rn'>IV IX XL XC CD CM</span>. You can’t subtract just any symbol — <span class='rn'>I</span> only goes before <span class='rn'>V</span> or <span class='rn'>X</span>, and <span class='rn'>X</span> only before <span class='rn'>L</span> or <span class='rn'>C</span>.",
    order:     "Roman numerals are written <b>biggest to smallest</b>, left to right (except subtraction pairs like <span class='rn'>IV</span>). Try rearranging your tiles from largest value to smallest!"
  };

  /**
   * Hint for ATTEMPT 1 (gentle nudge).
   * If a rule was broken, explain the rule; otherwise compare values.
   */
  function attempt1(userStr, userVal, target){
    const code = R.diagnose(userStr);
    if (userStr.length === 0)
      return "The workspace is empty! Tap the stone tiles to build your numeral, then submit.";
    if (code) return RULE_TEXT[code];
    if (userVal < target)
      return `Your carving equals <span class='rn'>${userVal}</span> — that's <b>too small</b> by ${target - userVal}. Add more value, or use a bigger symbol!`;
    return `Your carving equals <span class='rn'>${userVal}</span> — that's <b>too big</b> by ${userVal - target}. Remove some value, or use subtraction!`;
  }

  /**
   * Hint for ATTEMPT 2 (direct rule reminder built from the
   * correct answer's largest chunk, e.g. "To make 40, put X before L").
   */
  function attempt2(target){
    const tokens = R.tokenize(R.toRoman(target));
    // Find the most "teachable" token: prefer a subtractive pair, else the first token
    const sub = tokens.find(t => t.roman.length === 2 && R.VALUES[t.roman[0]] < R.VALUES[t.roman[1]]);
    if (sub){
      const [a, b] = [sub.roman[0], sub.roman[1]];
      return `Direct clue: to make <b>${sub.value}</b>, place <span class='rn'>${a}</span> (${R.VALUES[a]}) to the <b>left</b> of <span class='rn'>${b}</span> (${R.VALUES[b]}) → <span class='rn'>${sub.roman}</span>. Start your numeral with the biggest part: <span class='rn'>${tokens[0].roman}</span> (${tokens[0].value}).`;
    }
    const first = tokens[0];
    return `Direct clue: start with <span class='rn'>${first.roman}</span>, which makes <b>${first.value}</b>. Then keep adding pieces from biggest to smallest until you reach ${target}.`;
  }

  /**
   * Full reveal for ATTEMPT 3: correct answer + math breakdown.
   */
  function reveal(target){
    const roman = R.toRoman(target);
    const tokens = R.tokenize(roman);
    const math = tokens.map(t => `${t.roman} (${t.value})`).join(" + ");
    return `The vault opens to reveal the answer:<br>
      <span class='rn' style="font-size:1.5em">${roman}</span>
      <div class='breakdown-box'>${math} = <b>${target}</b></div>
      Study it, hunter — the next vault awaits!`;
  }

  return { attempt1, attempt2, reveal };
})();

/* ============================================================
   5. GAME — state machine, rendering, and events
   ============================================================ */
const Game = (() => {
  const R = RomanEngine;
  const SYMBOLS = ["I","V","X","L","C","D","M"];

  /* ----- State ----- */
  const state = {
    level: 1,
    artifacts: 0,
    target: null,
    tries: 3,          // urns remaining this level
    tiles: [],         // symbols currently in workspace
    locked: false      // input frozen while modal shown
  };

  /* ----- DOM refs ----- */
  const $ = id => document.getElementById(id);
  const el = {
    level: $("hud-level"), artifacts: $("hud-artifacts"),
    urns: [$("urn-1"), $("urn-2"), $("urn-3")],
    target: $("target-number"),
    workspace: $("workspace"), translation: $("translation"),
    deck: $("deck"),
    undo: $("btn-undo"), clear: $("btn-clear"), submit: $("btn-submit"),
    overlay: $("modal-overlay"), mIcon: $("modal-icon"),
    mTitle: $("modal-title"), mBody: $("modal-body"), mBtn: $("modal-btn")
  };

  /* ================= INIT ================= */
  function init(){
    // Restore progress or start fresh
    const saved = Store.load();
    if (saved){
      state.level     = saved.level;
      state.artifacts = saved.artifacts || 0;
      state.target    = saved.target ?? Levels.generateTarget(state.level);
      state.tries     = saved.tries ?? 3;
    } else {
      state.target = Levels.generateTarget(state.level);
    }
    buildDeck();
    bindEvents();
    renderAll();
    Store.save(state);
  }

  /* ================= DECK ================= */
  function buildDeck(){
    el.deck.innerHTML = "";
    for (const sym of SYMBOLS){
      const btn = document.createElement("button");
      btn.className = "tile-btn";
      btn.dataset.sym = sym;
      btn.innerHTML = `${sym}<small>${R.VALUES[sym]}</small>`;
      // pointerup fires reliably for both touch and mouse
      btn.addEventListener("pointerup", () => addTile(sym));
      el.deck.appendChild(btn);
    }
    refreshDeckLocks();
  }

  /** Lock tiles the current difficulty band hasn't introduced yet. */
  function refreshDeckLocks(){
    const unlocked = Levels.unlockedSymbols(state.level);
    for (const btn of el.deck.children){
      const isLocked = !unlocked.includes(btn.dataset.sym);
      btn.classList.toggle("locked", isLocked);
      btn.disabled = isLocked;
    }
  }

  /* ================= WORKSPACE ================= */
  function addTile(sym){
    if (state.locked) return;
    if (state.tiles.length >= 15) return;  // sanity cap
    state.tiles.push(sym);
    renderWorkspace();
  }

  function removeTileAt(index){
    if (state.locked) return;
    state.tiles.splice(index, 1);
    renderWorkspace();
  }

  function undoTile(){
    if (state.locked) return;
    state.tiles.pop();
    renderWorkspace();
  }

  function clearTiles(){
    if (state.locked) return;
    state.tiles = [];
    renderWorkspace();
  }

  function renderWorkspace(){
    el.workspace.innerHTML = "";
    if (state.tiles.length === 0){
      el.workspace.innerHTML = `<span class="placeholder">Tap the stone tiles below…</span>`;
    } else {
      state.tiles.forEach((sym, i) => {
        const t = document.createElement("span");
        t.className = "ws-tile";
        t.textContent = sym;
        t.title = "Tap to remove";
        t.addEventListener("pointerup", e => { e.stopPropagation(); removeTileAt(i); });
        el.workspace.appendChild(t);
      });
    }
    renderTranslation();
  }

  /** Live math breakdown under the workspace. */
  function renderTranslation(){
    const str = state.tiles.join("");
    if (!str){
      el.translation.innerHTML = "Your carving will be translated here.";
      return;
    }
    const tokens = R.tokenize(str);
    const parts = tokens.map(t => `${t.roman} (${t.value})`).join(" + ");
    const total = R.toArabic(str);
    const valid = R.isValidRoman(str);
    el.translation.innerHTML = valid
      ? `${parts} = <span class="tval">${total}</span>`
      : `${parts} = <span class="tval">${total}</span> &nbsp;<span class="invalid">⚠ not standard form</span>`;
  }

  /* ================= HUD ================= */
  function renderHUD(){
    el.level.textContent = state.level;
    el.artifacts.textContent = `🏺 ${state.artifacts}`;
    el.urns.forEach((u, i) => u.classList.toggle("lost", i >= state.tries));
  }

  function renderTarget(){
    el.target.textContent = state.target;
  }

  function renderAll(){
    renderHUD();
    renderTarget();
    renderWorkspace();
    refreshDeckLocks();
  }

  /* ================= MODAL ================= */
  let modalCallback = null;
  function showModal(icon, title, bodyHTML, btnText, onClose){
    state.locked = true;
    el.mIcon.innerHTML = icon;
    el.mTitle.textContent = title;
    el.mBody.innerHTML = bodyHTML;
    el.mBtn.textContent = btnText;
    modalCallback = onClose;
    el.overlay.classList.add("show");
  }
  function closeModal(){
    el.overlay.classList.remove("show");
    state.locked = false;
    const cb = modalCallback;
    modalCallback = null;
    if (cb) cb();
  }

  /* ================= SUBMIT / VALIDATION ================= */
  function submit(){
    if (state.locked) return;
    const str = state.tiles.join("");
    const valid = R.isValidRoman(str);
    const value = str ? R.toArabic(str) : 0;

    if (valid && value === state.target){
      handleWin();
    } else {
      handleMiss(str, value);
    }
  }

  /** Correct answer: award artifact tier by tries remaining. */
  function handleWin(){
    el.workspace.classList.add("flash-good");
    setTimeout(() => el.workspace.classList.remove("flash-good"), 700);

    // tries: 3 = first attempt, 2 = second, 1 = third
    const tier = { 3:["🏆","Gold Artifact",   "Solved on your <b>first try</b> — a flawless excavation!"],
                   2:["🥈","Silver Artifact", "Solved on your <b>second try</b> — well recovered!"],
                   1:["🥉","Bronze Artifact", "Solved on your <b>third try</b> — persistence pays off!"] }[state.tries];

    state.artifacts += 1;
    renderHUD();
    Store.save(state);

    const roman = R.toRoman(state.target);
    showModal(
      `<span class="artifact-pop">${tier[0]}</span>`,
      tier[1] + " Earned!",
      `<span class='rn' style="font-size:1.4em">${roman}</span> = <b>${state.target}</b><br>${tier[2]}`,
      "Next Level ⚒",
      nextLevel
    );
  }

  /** Wrong answer: consume an urn and scaffold with escalating hints. */
  function handleMiss(str, value){
    el.workspace.classList.add("flash-bad");
    setTimeout(() => el.workspace.classList.remove("flash-bad"), 500);

    state.tries -= 1;
    renderHUD();
    Store.save(state);

    if (state.tries === 2){
      // ATTEMPT 1 WRONG — gentle rule hint
      showModal("📜", "Hint from the Oracle",
        Hints.attempt1(str, value, state.target),
        "Try Again", null);
    } else if (state.tries === 1){
      // ATTEMPT 2 WRONG — direct rule reminder
      showModal("🗿", "Rule Reminder",
        Hints.attempt2(state.target),
        "Last Try!", null);
    } else {
      // ATTEMPT 3 WRONG — reveal answer, no artifact, move on
      showModal("🏛️", "The Vault Opens…",
        Hints.reveal(state.target),
        "Next Level →",
        nextLevel);
    }
  }

  /* ================= LEVEL PROGRESSION ================= */
  function nextLevel(){
    state.level += 1;
    state.target = Levels.generateTarget(state.level);
    state.tries  = 3;
    state.tiles  = [];
    renderAll();
    Store.save(state);
  }

  /* ================= EVENTS ================= */
  function bindEvents(){
    el.undo.addEventListener("pointerup", undoTile);
    el.clear.addEventListener("pointerup", clearTiles);
    el.submit.addEventListener("pointerup", submit);
    el.mBtn.addEventListener("pointerup", closeModal);
    // Prevent double-tap zoom on iOS inside the game area
    document.addEventListener("dblclick", e => e.preventDefault(), { passive:false });
  }

  return { init };
})();

/* Boot the game */
Game.init();
</script>
</body>
</html>
