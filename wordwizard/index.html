<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wizard: The Language Quest</title>
    <meta name="description" content="Embark on an enchanting adventure to master English! This game helps kids boost their vocabulary, spelling, and grammar through exciting challenges. Unscramble words, choose the best fit for sentences, define tricky terms, and fix grammar mistakes to become the ultimate Word Wizard!">
    <meta name="keywords" content="word game, vocabulary, spelling, grammar, English, educational game, kids game, language quest">
    <link rel="canonical" href="https://apps.100rabh.com/wordwizard/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/wordwizard/">
    <meta property="og:title" content="Word Wizard: The Language Quest">
    <meta property="og:description" content="Embark on an enchanting adventure to master English! This game helps kids boost their vocabulary, spelling, and grammar through exciting challenges. Unscramble words, choose the best fit for sentences, define tricky terms, and fix grammar mistakes to become the ultimate Word Wizard!">
    <meta property="og:image" content="https://apps.100rabh.com/wordwizard/images/enchanted_forest_bg.png"> <!-- Using enchanted_forest_bg.png as OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/wordwizard/">
    <meta property="twitter:title" content="Word Wizard: The Language Quest">
    <meta property="twitter:description" content="Embark on an enchanting adventure to master English! This game helps kids boost their vocabulary, spelling, and grammar through exciting challenges. Unscramble words, choose the best fit for sentences, define tricky terms, and fix grammar mistakes to become the ultimate Word Wizard!">
    <meta property="twitter:image" content="https://apps.100rabh.com/wordwizard/images/enchanted_forest_bg.png"> <!-- Using enchanted_forest_bg.png as Twitter image -->

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #333; font-family: sans-serif; font-size: 0.9em; position: absolute; top: 15px; left: 15px;">&larr; Back to all apps</a>
        <h1>Word Wizard: The Language Quest</h1>
        <div id="game-area">
            <div id="quest-info">
                <h2>Realm: The Enchanted Forest <img src="images/forest_icon.png" alt="Enchanted Forest Icon"></h2>
                <p>Level: <span id="current-level">1</span></p>
            </div>
            <div id="question-card">
                <p id="question-text"></p>
                <div id="answer-area">
                </div>
                <button id="submit-answer">Cast Spell</button>
                <p id="feedback" class="hidden"></p>
            </div>

            <div id="game-over" class="hidden">
                <h2>Quest Complete!</h2>
                <p>You are a true Word Wizard!</p>
                <button id="restart-game">Embark on a New Quest</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
