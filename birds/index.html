<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for bird icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="bird-decor top-left">🐦</div>
        <div class="bird-decor top-right">🦅</div>
        <div class="bird-decor bottom-left">🦆</div>
        <div class="bird-decor bottom-right">🦉</div>
        
        <div class="content-wrapper">
            <div id="start-screen">
                <h1>
                    <span class="bird-icon">🦜</span>
                    Bird Quiz
                    <span class="bird-icon">🐦</span>
                </h1>
                <p class="description">Test your knowledge about birds with this fun quiz!</p>
                <button id="start-button">Start <i class="fas"></i></button>
            </div>
            <div id="quiz-screen" class="hidden">
                <div class="quiz-header">
                    <h2>
                        <span class="bird-icon">🦜</span>
                        Bird Quiz
                        <span class="bird-icon">🐦</span>
                    </h2>
                    <div id="score">Score: 0</div>
                </div>
                <h2 id="question"></h2>
                <div id="options" class="options-container"></div>
            </div>
        </div>
    </div>
    <audio id="success-sound" src="bird-chirp-success.mp3"></audio>
    <audio id="error-sound" src="bird-chirp-error.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
