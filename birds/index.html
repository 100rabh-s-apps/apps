<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test your knowledge about birds with this fun and interactive quiz game. Learn about different bird species and their sounds.">
    <meta name="keywords" content="bird quiz, bird game, bird species, bird sounds, nature quiz, educational game">
    <link rel="canonical" href="https://apps.100rabh.com/birds/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/birds/">
    <meta property="og:title" content="Bird Quiz Game">
    <meta property="og:description" content="Test your knowledge about birds with this fun and interactive quiz game. Learn about different bird species and their sounds.">
    <meta property="og:image" content="https://apps.100rabh.com/birds/background.png"> <!-- Assuming background.png can be used as an OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/birds/">
    <meta property="twitter:title" content="Bird Quiz Game">
    <meta property="twitter:description" content="Test your knowledge about birds with this fun and interactive quiz game. Learn about different bird species and their sounds.">
    <meta property="twitter:image" content="https://apps.100rabh.com/birds/background.png"> <!-- Assuming background.png can be used as a Twitter image -->

    <title>Bird Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for bird icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="bird-decor top-left">🐦</div>
        <div class="bird-decor top-right">🦅</div>
        <div class="bird-decor bottom-left">🦆</div>
        <div class="bird-decor bottom-right">🦉</div>
        
        <div class="content-wrapper">
            <div id="start-screen">
                <h1>
                    <span class="bird-icon">🦜</span>
                    Bird Quiz
                    <span class="bird-icon">🐦</span>
                </h1>
                <p class="description">Test your knowledge about birds with this fun quiz!</p>
                <button id="start-button">Start <i class="fas"></i></button>
            </div>
            <div id="quiz-screen" class="hidden">
                <div class="quiz-header">
                    <h2>
                        <span class="bird-icon">🦜</span>
                        Bird Quiz
                        <span class="bird-icon">🐦</span>
                    </h2>
                    <div id="score">Score: 0</div>
                </div>
                <h2 id="question"></h2>
                <div id="options" class="options-container"></div>
            </div>
        </div>
    </div>
    <audio id="success-sound" src="bird-chirp-success.mp3"></audio>
    <audio id="error-sound" src="bird-chirp-error.mp3"></audio>
    <script src="script.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</body>
</html>
