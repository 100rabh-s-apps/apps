<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Quiz for Kids</title>
    <meta name="description" content="Test your knowledge about the planets with this fun and educational quiz game for kids. Click on the correct planet to answer each question and learn about our solar system.">
    <meta name="keywords" content="solar system, quiz, planets, kids, educational game, space, astronomy">
    <link rel="canonical" href="https://apps.100rabh.com/solarsystem/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/solarsystem/">
    <meta property="og:title" content="Solar System Quiz for Kids">
    <meta property="og:description" content="Test your knowledge about the planets with this fun and educational quiz game for kids. Click on the correct planet to answer each question and learn about our solar system.">
    <meta property="og:image" content="https://apps.100rabh.com/solarsystem/planets.jpg"> <!-- Using planets.jpg as OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/solarsystem/">
    <meta property="twitter:title" content="Solar System Quiz for Kids">
    <meta property="twitter:description" content="Test your knowledge about the planets with this fun and educational quiz game for kids. Click on the correct planet to answer each question and learn about our solar system.">
    <meta property="twitter:image" content="https://apps.100rabh.com/solarsystem/planets.jpg"> <!-- Using planets.jpg as Twitter image -->

    <link rel="stylesheet" href="style.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</head>
<body>
    <div class="container" style="position: relative;">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #fff; background-color: #198754; padding: 5px 10px; border-radius: 5px; font-family: sans-serif; position: absolute; top: 10px; left: 10px; z-index: 1000;">&larr; Back to all apps</a>
        <h1>Solar System Quiz for Kids</h1>
        <p class="subtitle">Test your knowledge about the planets! Click on the correct planet to answer each question.</p>

        <div id="difficulty-selection">
            <h2>Choose a Difficulty</h2>
            <button class="difficulty-btn easy" onclick="startGame('Easy')">Easy</button>
            <button class="difficulty-btn medium" onclick="startGame('Medium')">Medium</button>
            <button class="difficulty-btn hard" onclick="startGame('Hard')">Hard</button>
        </div>

        <div id="quiz-container" style="display: none;">
            <div class="question-container">
                <div class="difficulty easy" id="difficulty">Easy</div>
                <div class="question" id="question">Loading question...</div>
                
                <div class="planets-container">
                    <div class="planet mercury" onclick="selectPlanet('Mercury')">
                        <img src="planets/mercury.jpg" alt="Mercury">
                        <span class="planet-label">Mercury</span>
                    </div>
                    <div class="planet venus" onclick="selectPlanet('Venus')">
                        <img src="planets/venus.jpg" alt="Venus">
                        <span class="planet-label">Venus</span>
                    </div>
                    <div class="planet earth" onclick="selectPlanet('Earth')">
                        <img src="planets/earth.jpg" alt="Earth">
                        <span class="planet-label">Earth</span>
                    </div>
                    <div class="planet mars" onclick="selectPlanet('Mars')">
                        <img src="planets/mars.jpg" alt="Mars">
                        <span class="planet-label">Mars</span>
                    </div>
                    <div class="planet jupiter" onclick="selectPlanet('Jupiter')">
                        <img src="planets/jupiter.jpg" alt="Jupiter">
                        <span class="planet-label">Jupiter</span>
                    </div>
                    <div class="planet saturn" onclick="selectPlanet('Saturn')">
                        <img src="planets/saturn.jpg" alt="Saturn">
                        <span class="planet-label">Saturn</span>
                    </div>
                    <div class="planet uranus" onclick="selectPlanet('Uranus')">
                        <img src="planets/uranus.jpg" alt="Uranus">
                        <span class="planet-label">Uranus</span>
                    </div>
                    <div class="planet neptune" onclick="selectPlanet('Neptune')">
                        <img src="planets/neptune.jpg" alt="Neptune">
                        <span class="planet-label">Neptune</span>
                    </div>
                </div>
                
                <div class="feedback" id="feedback"></div>
                
                <div class="controls">
                    <button id="nextBtn" style="display: none;">Next Question</button>
                    <button onclick="resetGame()">Reset Game</button>
                </div>
            </div>
            
            <div class="score-container">
                Score: <span id="score">0</span> / <span id="total">0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
