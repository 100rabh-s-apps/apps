<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonym & Antonym Showdown</title>
    <meta name="description" content="Step into the arena of words and test your English vocabulary! Synonym & Antonym Showdown is an engaging drag-and-drop game designed for students from Grade 1 to Grade 5. Match words with their synonyms or antonyms, earn points, and master new vocabulary in a fun, interactive challenge. Perfect for building language skills!">
    <meta name="keywords" content="synonym, antonym, word game, vocabulary, English, educational game, drag and drop, kids game">
    <link rel="canonical" href="https://apps.100rabh.com/synoanto/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/synoanto/">
    <meta property="og:title" content="Synonym & Antonym Showdown">
    <meta property="og:description" content="Step into the arena of words and test your English vocabulary! Synonym & Antonym Showdown is an engaging drag-and-drop game designed for students from Grade 1 to Grade 5. Match words with their synonyms or antonyms, earn points, and master new vocabulary in a fun, interactive challenge. Perfect for building language skills!">
    <meta property="og:image" content="https://apps.100rabh.com/synoanto/og-image.png"> <!-- Using og-image.png as OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/synoanto/">
    <meta property="twitter:title" content="Synonym & Antonym Showdown">
    <meta property="twitter:description" content="Step into the arena of words and test your English vocabulary! Synonym & Antonym Showdown is an engaging drag-and-drop game designed for students from Grade 1 to Grade 5. Match words with their synonyms or antonyms, earn points, and master new vocabulary in a fun, interactive challenge. Perfect for building language skills!">
    <meta property="twitter:image" content="https://apps.100rabh.com/synoanto/og-image.png"> <!-- Using og-image.png as Twitter image -->

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #5bc0de; font-family: 'Roboto', sans-serif; font-size: 0.9em; position: absolute; top: 15px; left: 15px;">&larr; Back to all apps</a>
        <h1>Synonym & Antonym Showdown</h1>
        <div class="score-timer">
            <p>Score: <span id="score">0</span></p>
            <p>Time: <span id="timer">60</span>s</p>
        </div>

        <div class="main-word-area">
            <p class="label">Main Word:</p>
            <div id="mainWord" class="word-card main-word"></div>
        </div>

        <div class="drop-zones">
            <div id="synonymZone" class="drop-zone">
                <h2>Synonym</h2>
            </div>
            <div id="antonymZone" class="drop-zone">
                <h2>Antonym</h2>
            </div>
        </div>

        <div id="wordChoices" class="word-choices">
            </div>

        <button id="startButton">Start Game</button>
        <button id="resetButton" style="display: none;">Play Again</button>

        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <p>Your final score: <span id="finalScore">0</span></p>
                <button id="closeModalButton">Close</button>
            </div>
        </div>
    </div>

    <audio id="correctSound" src="correct.mp3" preload="auto"></audio>
    <audio id="incorrectSound" src="incorrect.mp3" preload="auto"></audio>

    <script src="script.js"></script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</body>
</html>
