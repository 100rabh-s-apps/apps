    <style>
        :root {
            --sky-top: #87CEEB;

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Open Sans', sans-serif;

        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #ui-layer>* {
            pointer-events: auto;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 1rem 0;
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.05);
            font-size: 2.5rem;
        }

        p {
            color: var(--text-dark);
            line-height: 1.5;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        input {
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            border: 3px solid var(--secondary);
            font-size: 1.3rem;
            margin: 1rem 0;
            width: 100%;
            font-family: 'Open Sans', sans-serif;
            text-align: center;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            background: white;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.2);
            transform: translateY(-2px);
        }

        button {
            padding: 1rem 2rem;
            border-radius: 3rem;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            font-family: 'Open Sans', sans-serif;
            margin: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .difficulty-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-beginner {
            background: #8BC34A;
            box-shadow: 0 4px 15px rgba(139, 195, 74, 0.3);
        }

        .btn-learner {
            background: #FF9800;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-pro {
            background: #9C27B0;
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.3);
        }

        .btn-beginner:hover {
            box-shadow: 0 6px 20px rgba(139, 195, 74, 0.4);
        }

        .btn-learner:hover {
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }

        .btn-pro:hover {
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.4);
        }

        .profile-chip {
            background: var(--secondary);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
        }

        .profile-chip:hover {
            transform: scale(1.05);
            background: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Screens */
        .screen {
            display: none;

            align-items: center;

            border-radius: 2rem;

            text-align: center;

        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            0%,
            100% {

            }

            50% {
                transform: translateY(-10px);
            }

                padding: 1.5rem;
                border-radius: 1.5rem;

            h1 {
                font-size: 1.5rem;

                font-size: 1rem;
                padding: 0.6rem 1.5rem;
            }

            .hud-item {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;

        .hud-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            pointer-events: none;
        }

        /* Gameplay Elements */
        #balloon-wrapper {
            position: absolute;
            left: 38%;
            top: 40%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            width: auto;
            pointer-events: none;
            animation: bob 4s ease-in-out infinite;
            /* Move bob here, slower for smoother feel */
        }

        .balloon-envelope {
            width: 220px;
            height: 260px;
            background: radial-gradient(circle at 30% 30%, var(--primary), #d32f2f);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            position: relative;
            box-shadow: inset -15px -15px 30px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .balloon-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 20px,
                    rgba(255, 255, 255, 0.1) 20px,
                    rgba(255, 255, 255, 0.1) 40px);
            border-radius: inherit;
        }

        .balloon-ropes {
            width: 100%;
            height: 200px;
            position: relative;
            margin: -80px 0;
            z-index: 1;
        }

        /* 4 Ropes connecting envelope to basket */
        .balloon-ropes::before,
        .balloon-ropes::after,
        .balloon-ropes span {
            content: '';
            position: absolute;
            top: 0;
            width: 3px;
            height: 100%;
            background: #5d4037;
        }

        .balloon-ropes::before {
            left: 40px;
            transform: rotate(-15deg);
        }

        .balloon-ropes::after {
            right: 40px;
            transform: rotate(15deg);
        }

        .balloon-ropes span:first-child {
            left: 80px;
            transform: rotate(-5deg);
        }

        .balloon-ropes span:last-child {
            right: 80px;
            transform: rotate(5deg);
        }

        @media (max-width: 600px) {
            .balloon-envelope {
                width: 140px;
                height: 170px;
            }

            .balloon-ropes {
                height: 170px;
                margin: -60px 0;
                width: 80%;
            }

            .balloon-ropes::before {
                left: 25px;
            }

            .balloon-ropes::after {
                right: 25px;
            }

            .balloon-ropes span:first-child {

            }

            .balloon-ropes span:last-child {

                width: 160px !important;

                font-size: 30px !important;

            }

            border-radius: 15px;

            display: flex;
            align-items: center;

            z-index: 5;

            left: 0;

            height: 100%;

            min-width: 120px;
            max-width: 220px;
            min-height: 60px;
            background: white;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.3s, box-shadow 0.3s, left 0.5s, top 0.5s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px 20px;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.1));
        }

        .word-cloud:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), 0 0 15px var(--secondary);
            z-index: 30;
        }

        @media (max-width: 600px) {
            .word-cloud {
                min-width: 100px;
                max-width: 160px;
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }

        /* Improved cloud shape with box-shadows instead of fixed-position pseudos */
        .word-cloud::before,
        .word-cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
            z-index: -1;
        }

        .word-cloud::before {
            width: 60%;
            height: 80%;
            top: -30%;
            left: 10%;
        }

        .word-cloud::after {
            width: 50%;
            height: 70%;
            top: -40%;
            right: 15%;
        }

        .word-cloud:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), 0 0 15px var(--secondary);
            z-index: 20;
        }

        .word-cloud.correct {
            background: #4caf50;
            color: white;
        }

        .word-cloud.correct::after {
            background: #4caf50;
        }

        .word-cloud.wrong {
            background: #f44336;
            color: white;
        }

        .word-cloud.wrong::before,
        .word-cloud.wrong::after {

        /* Mastery Animation */
        .mastery-star {
            position: absolute;
            color: var(--accent);
            font-size: 2rem;
            pointer-events: none;

        @keyframes starPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);

            50% {
                opacity: 1;
                transform: scale(1.5) rotate(180deg);

        #feedback {

            top: 20%;
            left: 50%;

            z-index: 100;

        .feedback-animate {
            animation: feedbackPop 0.8s ease-out;

        @keyframes feedbackPop {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px) scale(0.5);

            50% {
                opacity: 1;

<body>

    <div id="game-container">
        <canvas id="parallax-canvas"></canvas>

        <div id="hud">
            <div class="hud-item" id="pilot-stat">
                <i class="bi bi-person-circle"></i> <span id="pilot-name-display">Pilot</span>
            </div>
            <div class="hud-item" id="mastered-stat">
                <i class="bi bi-star-fill" style="color: var(--accent)"></i> <span id="mastered-count">0</span> Mastered
            </div>
            <div class="hud-item" id="level-stat" style="cursor: pointer; pointer-events: auto;"
                onclick="showScreen('screen-difficulty'); document.getElementById('balloon-wrapper').style.display='none';">
                <i class="bi bi-gear-fill"></i> Level
            </div>
        </div>

        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="screen-start" class="screen active">
                <i class="bi bi-balloon-heart-fill"
                    style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;"></i>
                <h1>Word Explorer</h1>
                <p>Welcome, Pilot! What's your name?</p>
                <input type="text" id="pilot-name-input" placeholder="Your Explorer Name..." maxlength="15">
                <div id="profiles-list"
                    style="margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; max-width: 80%;">
                </div>
                <button id="btn-start">Start Adventure <i class="bi bi-airplane-fill"></i></button>
            </div>

            <!-- Difficulty Screen -->
            <div id="screen-difficulty" class="screen">
                <h1>Choose Your Altitude</h1>
                <p>Pick a level to start exploring words.</p>
                <div class="difficulty-btns">
                    <button class="btn-beginner" data-level="beginner">Beginner</button>
                    <button class="btn-learner" data-level="learner">Learner</button>
                    <button class="btn-pro" data-level="pro">Pro</button>
                </div>
            </div>

            <!-- Game Over / Victory Screen -->
            <div id="screen-victory" class="screen">
                <h1 id="victory-title">Great Job!</h1>
                <p id="victory-msg">You've explored many words today.</p>
                <button id="btn-restart">Fly Again</button>
                <button id="btn-change-level" style="background: var(--secondary)">Change Level</button>
            </div>
        </div>

        <!-- In-game entities -->
        <div id="balloon-wrapper" style="display: none;">
            <div class="balloon-envelope">
                <div class="balloon-stripes"></div>
            </div>
            <div class="balloon-ropes">
                <span></span>
                <span></span>
            </div>
            <div class="balloon-basket">
                <div class="pilot">🦊</div>
                <div id="meaning-text">Meaning goes here...</div>
            </div>
        </div>

        <div id="clouds-container"></div>
        <div id="feedback">CORRECT!</div>
        <button id="mute-btn"><i class="bi bi-volume-up-fill"></i></button>
    </div>

    <script>
        // --- DATA LOADING ---
        const WORD_DATA = {
            beginner: [],
            learner: [],
            pro: []
        };

        async function loadWordData() {
            const startBtn = document.getElementById('btn-start');
            const originalText = startBtn.innerText;
            startBtn.disabled = true;
            startBtn.innerText = "Loading Words...";

            try {
                const [beginner, learner, pro] = await Promise.all([
                    fetch('beginner_words.csv').then(r => r.text()),
                    fetch('learner_words.csv').then(r => r.text()),
                    fetch('pro_words.csv').then(r => r.text())
                ]);

                WORD_DATA.beginner = parseCSV(beginner);
                WORD_DATA.learner = parseCSV(learner);
                WORD_DATA.pro = parseCSV(pro);

                console.log(`Loaded ${WORD_DATA.beginner.length} beginner, ${WORD_DATA.learner.length} learner, ${WORD_DATA.pro.length} pro words.`);
                startBtn.disabled = false;
                startBtn.innerText = originalText;
            } catch (err) {
                console.error("Failed to load word data:", err);
                alert("Could not load word files. Please ensure beginner_words.csv, learner_words.csv, and pro_words.csv are in the same folder.");
                startBtn.innerText = "Error Loading";
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                let word, def;
                const firstComma = line.indexOf(',');
                if (firstComma === -1) continue;

                word = line.substring(0, firstComma).trim().replace(/^"|"$/g, '');
                def = line.substring(firstComma + 1).trim();

                if (def.startsWith('"') && def.endsWith('"')) {
                    def = def.substring(1, def.length - 1);
                }
                def = def.replace(/""/g, '"');

                if (word && def) result.push({ word, def });
            }
            return result;
        }

        // --- GAME ENGINE ---
        const state = {
            pilotName: '',
            level: 'beginner',
            wordStats: {},
            currentWord: null,
            options: [],
            masteredCount: 0,
            isMuted: false,
            score: 0
        };

        const canvas = document.getElementById('parallax-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const layers = [
            { speed: 0.2, items: [], color: 'rgba(255,255,255,0.3)', size: [100, 200] },
            { speed: 0.5, items: [], color: 'rgba(150,100,200,0.2)', size: [200, 400] },
            { speed: 1.2, items: [], color: 'rgba(255,255,255,0.6)', size: [50, 100] }
        ];

        function initBackground() {
            layers.forEach(layer => {
                layer.items = [];
                for (let i = 0; i < 10; i++) {
                    layer.items.push({
                        x: Math.random() * width,
                        y: Math.random() * height * 0.8,
                        w: layer.size[0] + Math.random() * layer.size[1],
                        h: layer.size[0] / 2
                    });
                }
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, width, height);
            layers.forEach((layer, index) => {
                ctx.fillStyle = layer.color;
                layer.items.forEach(item => {
                    item.x -= layer.speed;
                    if (item.x + item.w < 0) item.x = width;

                    if (index === 1) { // Mountains
                        ctx.beginPath();
                        ctx.moveTo(item.x, item.y + item.h);
                        ctx.lineTo(item.x + item.w / 2, item.y);
                        ctx.lineTo(item.x + item.w, item.y + item.h);
                        ctx.fill();
                    } else { // Clouds
                        ctx.beginPath();
                        ctx.ellipse(item.x, item.y, item.w / 2, item.h / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            });
            requestAnimationFrame(drawBackground);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (state.isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'whoosh') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            } else if (type === 'hiss') {
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1000;
                noise.connect(filter);
                filter.connect(gain);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                noise.start();
            } else if (type === 'ding') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start();
                osc.stop(now + 0.5);
            } else if (type === 'tada') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'square';
                    o.frequency.value = f;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, now);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    o.start(now + i * 0.1);
                    o.stop(now + 0.6);
                });
            }
        }

        function saveProgress() {
            const profile = {
                wordStats: state.wordStats,
                level: state.level,
                score: state.score,
                masteredCount: state.masteredCount
            };
            localStorage.setItem(`wordExplorer_profile_${state.pilotName}`, JSON.stringify(profile));
            localStorage.setItem('wordExplorer_lastPilot', state.pilotName);

            // Update all pilots list
            let pilots = JSON.parse(localStorage.getItem('wordExplorer_allPilots') || '[]');
            if (!pilots.includes(state.pilotName)) {
                pilots.push(state.pilotName);
                localStorage.setItem('wordExplorer_allPilots', JSON.stringify(pilots));
            }
        }

        function renderProfiles() {
            const pilots = JSON.parse(localStorage.getItem('wordExplorer_allPilots') || '[]');
            const container = document.getElementById('profiles-list');
            container.innerHTML = '';
            if (pilots.length > 0) {
                pilots.forEach(p => {
                    const chip = document.createElement('div');
                    chip.className = 'profile-chip';
                    chip.innerText = p;
                    chip.onclick = () => {
                        document.getElementById('pilot-name-input').value = p;
                        document.getElementById('btn-start').click();
                    };
                    container.appendChild(chip);
                });
            }
        }

        function loadProgress() {
            const saved = localStorage.getItem(`wordExplorer_profile_${state.pilotName}`);
            if (saved) {
                const profile = JSON.parse(saved);
                state.wordStats = profile.wordStats || {};
                state.level = profile.level || 'beginner';
                state.score = profile.score || 0;
                // Recalculate mastered count to be safe
                state.masteredCount = Object.values(state.wordStats).filter(v => v >= 3).length;

                document.getElementById('mastered-count').innerText = state.masteredCount;
                return true;
            } else {
                state.wordStats = {};
                state.level = 'beginner';
                state.score = 0;
                state.masteredCount = 0;
                document.getElementById('mastered-count').innerText = 0;
                return false;
            }
        }

        function nextQuestion() {
            const pool = WORD_DATA[state.level].filter(w => (state.wordStats[w.word] || 0) < 3);
            if (pool.length === 0) {
                showVictory();
                return;
            }
            const target = pool[Math.floor(Math.random() * pool.length)];
            state.currentWord = target;
            const allWords = WORD_DATA[state.level];
            const distractors = [];
            while (distractors.length < 3) {
                const d = allWords[Math.floor(Math.random() * allWords.length)];
                if (d.word !== target.word && !distractors.find(x => x.word === d.word)) {
                    distractors.push(d);
                }
            }
            state.options = [...distractors, target].sort(() => Math.random() - 0.5);
            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('clouds-container');
            container.innerHTML = '';
            document.getElementById('meaning-text').innerText = state.currentWord.def;
            const isMobile = window.innerWidth < 600;
            let positions;
            if (isMobile) {
                positions = [
                    { top: '10%', left: '50%' },
                    { top: '25%', left: '50%' },
                    { top: '70%', left: '50%' },
                    { top: '85%', left: '50%' }
                ];
                positions = positions.map(p => ({
                    ...p,
                    left: `calc(${p.left} - 75px)` // Half of min-width approx
                }));
            } else {
                positions = [
                    { top: '15%', left: '15%' },
                    { top: '15%', left: '65%' },
                    { top: '45%', left: '10%' },
                    { top: '45%', left: '70%' }
                ].sort(() => Math.random() - 0.5);
            }
            state.options.forEach((opt, i) => {
                const cloud = document.createElement('div');
                cloud.className = 'word-cloud';
                cloud.innerText = opt.word;

                // Set initial position without transition
                cloud.style.transition = 'none';
                cloud.style.top = positions[i].top;
                cloud.style.left = positions[i].left;

                // Re-enable transition after a short delay
                setTimeout(() => {
                    cloud.style.transition = 'background 0.3s, box-shadow 0.3s, left 0.5s, top 0.5s';
                }, 50);

                const offset = Math.random() * 2;
                cloud.style.animation = `bob ${3 + offset}s ease-in-out infinite`;

                cloud.onclick = (e) => {
                    e.stopPropagation();
                    console.log("Cloud clicked:", opt.word);
                    checkAnswer(opt.word, cloud);
                };
                container.appendChild(cloud);
            });
            document.getElementById('balloon-wrapper').style.top = '40%';
            document.getElementById('balloon-wrapper').style.left = '38%';
        }

        function checkAnswer(word, element) {
            console.log("Checking answer:", word, "Target:", state.currentWord.word);
            if (word === state.currentWord.word) {
                element.classList.add('correct');
                state.wordStats[word] = (state.wordStats[word] || 0) + 1;
                playSound('whoosh');
                showFeedback('EXCELLENT!');
                document.getElementById('balloon-wrapper').style.top = '40%';
                if (state.wordStats[word] === 3) {
                    state.masteredCount++;
                    document.getElementById('mastered-count').innerText = state.masteredCount;
                    playSound('tada');
                    spawnStars(element);
                }
                saveProgress();
                setTimeout(nextQuestion, 1200);
            } else {
                element.classList.add('wrong');
                playSound('hiss');
                showFeedback('OOPS!');
                const b = document.getElementById('balloon-wrapper');
                b.style.left = '38%';
                setTimeout(() => b.style.left = '36%', 100);
                setTimeout(() => b.style.left = '40%', 200);
                b.style.top = '45%';
            }
        }

        function showFeedback(text) {
            const el = document.getElementById('feedback');
            el.innerText = text;
            el.className = 'feedback-animate';
            setTimeout(() => el.className = '', 2000);
        }

        function spawnStars(parent) {
            const rect = parent.getBoundingClientRect();
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('i');
                star.className = 'bi bi-star-fill mastery-star';
                star.style.left = (rect.left + rect.width / 2) + 'px';
                star.style.top = rect.top + 'px';
                star.style.marginLeft = (Math.random() * 60 - 30) + 'px';
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }

        function showVictory() {
            document.getElementById('balloon-wrapper').style.display = 'none';
            document.getElementById('clouds-container').innerHTML = '';
            showScreen('screen-victory');
            document.getElementById('victory-title').innerText = "Altitude Record!";
            document.getElementById('victory-msg').innerText = `You've mastered all available words in ${state.level} level!`;
        }

        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        function showScreen(id) {
            hideAllScreens();
            if (id) {
                const screen = document.getElementById(id);
                if (screen) screen.classList.add('active');
            }
        }

        window.onload = async () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBackground();
            drawBackground();
            await loadWordData();
            renderProfiles();

            // Check for last pilot
            const lastPilot = localStorage.getItem('wordExplorer_lastPilot');
            if (lastPilot) {
                document.getElementById('pilot-name-input').value = lastPilot;
            }

            document.getElementById('btn-start').onclick = () => {
                const name = document.getElementById('pilot-name-input').value.trim();
                if (name) {
                    state.pilotName = name;
                    document.getElementById('pilot-name-display').innerText = name;
                    const hasProfile = loadProgress();

                    audioCtx.resume();
                    if (hasProfile) {
                        // Jump straight to the last level they played
                        hideAllScreens();
                        document.getElementById('balloon-wrapper').style.display = 'flex';
                        nextQuestion();
                    } else {
                        showScreen('screen-difficulty');
                    }
                } else {
                    alert("Please enter a name, Pilot!");
                }
            };
            document.querySelectorAll('.difficulty-btns button').forEach(btn => {
                btn.onclick = () => {
                    state.level = btn.dataset.level;
                    saveProgress(); // Save level choice
                    hideAllScreens();
                    document.getElementById('balloon-wrapper').style.display = 'flex';
                    nextQuestion();
                };
            });
            document.getElementById('btn-restart').onclick = () => {
                hideAllScreens();
                document.getElementById('balloon-wrapper').style.display = 'flex';
                nextQuestion();
            };
            document.getElementById('btn-change-level').onclick = () => {
                showScreen('screen-difficulty');
            };
            document.getElementById('mute-btn').onclick = () => {
                state.isMuted = !state.isMuted;
                document.getElementById('mute-btn').innerHTML = state.isMuted ? '<i class="bi bi-volume-mute-fill"></i>' : '<i class="bi bi-volume-up-fill"></i>';
            };
            window.onresize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initBackground();
                if (state.currentWord) renderQuestion();
            };
        };
    </script>
</body>
