<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continent & Country Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back-to-apps-container">
        <a href="../index.html" class="btn btn-primary">← Back to Apps</a>
    </div>
    <h1>Guess the Continent and Country</h1>
    <div id="game-container">
        <div id="svg-container"></div>
        <div id="question-container">
            <p id="question"></p>
            <div id="options"></div>
            <div id="controls">
                <button id="zoom-in" class="btn btn-secondary">+</button>
                <button id="zoom-out" class="btn btn-secondary">-</button>
                <button id="pan-up" class="btn btn-secondary">↑</button>
                <button id="pan-down" class="btn btn-secondary">↓</button>
                <button id="pan-left" class="btn btn-secondary">←</button>
                <button id="pan-right" class="btn btn-secondary">→</button>
                <button id="reset" class="btn btn-secondary">Reset</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="gameModal" tabindex="-1" aria-labelledby="gameModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="gameModalLabel">Game Message</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            ...
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
