<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Color Scheme: #6c5ce7 (Primary), #a29bfe (Secondary), #f0f2f5 (Soft White) -->
  
  <!-- Walls -->
  <rect width="1200" height="800" fill="#f0f2f5" />
  <path d="M0 0 L200 150 L1000 150 L1200 0 Z" fill="#e2e6ea" />
  <path d="M0 800 L200 650 L1000 650 L1200 800 Z" fill="#d1d8e0" />
  <path d="M0 0 L200 150 L200 650 L0 800 Z" fill="#dee2e6" />
  <path d="M1200 0 L1000 150 L1000 650 L1200 800 Z" fill="#dee2e6" />
  
  <!-- Main Wall Feature (Bookshelf/Mansion look) -->
  <rect x="350" y="200" width="500" height="400" rx="20" fill="#ffffff" stroke="#6c5ce7" stroke-width="4" />
  <line x1="350" y1="300" x2="850" y2="300" stroke="#a29bfe" stroke-width="2" />
  <line x1="350" y1="400" x2="850" y2="400" stroke="#a29bfe" stroke-width="2" />
  <line x1="350" y1="500" x2="850" y2="500" stroke="#a29bfe" stroke-width="2" />
  
  <!-- Window -->
  <rect x="50" y="250" width="100" height="150" fill="#ffffff" stroke="#6c5ce7" stroke-width="3" />
  <line x1="50" y1="325" x2="150" y2="325" stroke="#a29bfe" stroke-width="2" />
  <line x1="100" y1="250" x2="100" y2="400" stroke="#a29bfe" stroke-width="2" />
  
  <!-- Rug -->
  <ellipse cx="600" cy="720" rx="300" ry="60" fill="#a29bfe" opacity="0.3" />
</svg>
