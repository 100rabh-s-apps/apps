<html lang="hi">
  <head>
    <meta charset="UTF-8" />

    <title>हिंदी शब्द अनस्क्रैम्बलर</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap"
      rel="stylesheet" />

    <style>
      :root {
        --bg-color: #fdf5e6;
        /* Light Cream */
        --container-bg: #ffffff;
        --primary-color: #d9534f;
        /* Muted Red */
        --secondary-color: #5bc0de;
        /* Light Blue */
        --accent-color: #f0ad4e;
        /* Orange/Yellow */
        --text-color: #333333;
        --tile-bg: #f7f7f7;
        --slot-bg: #e9e9e9;
        --correct-color: #5cb85c;
        --font-family: "Noto Sans Devanagari", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .game-container {
        background-color: var(--container-bg);
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
        text-align: center;
      }

      h1 {
        color: var(--primary-color);
        margin-bottom: 0.5rem;
      }

      .instructions {
        margin-bottom: 1rem;
        font-size: 1.1rem;
        color: #666;
      }

      .stats-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 1.2rem;
        font-weight: bold;
      }

      #scrambled-word-display {
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 5px;
        margin-bottom: 2rem;
        color: var(--secondary-color);
        padding: 0.5rem;
        background-color: #f0f8ff;
        border-radius: 8px;
      }

      .drop-area-wrapper,
      .tile-area-wrapper {
        min-height: 80px;
        /* Ensure space is reserved */
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 1.5rem;
      }

      .drop-area-wrapper {
        background-color: var(--slot-bg);
        border: 2px dashed #ccc;
      }

      .tile-area-wrapper {
        background-color: #fff9f0;
      }

      .tile {
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem;
        font-weight: bold;
        border-radius: 10px;
        cursor: grab;
        user-select: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          background-color 0.2s ease;
        background-color: var(--tile-bg);
        border: 1px solid #ddd;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .tile.hinted {
        background-color: #dff0d8;
        cursor: not-allowed;
        opacity: 0.8;
      }

      .tile:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      .tile.dragging {
        opacity: 0.5;
        cursor: grabbing;
        transform: scale(1.1);
      }

      .controls,
      .game-actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 1rem;
      }

      button {
        padding: 10px 20px;
        font-size: 1rem;
        font-family: var(--font-family);
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        color: white;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      #check-btn {
        background-color: var(--correct-color);
      }

      #hint-btn {
        background-color: var(--accent-color);
      }

      #reset-btn {
        background-color: var(--secondary-color);
      }

      #new-game-btn {
        background-color: var(--primary-color);
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      #message {
        margin-top: 1.5rem;
        font-size: 1.2rem;
        font-weight: bold;
        height: 25px;
        transition: color 0.3s;
      }

      .message-correct {
        color: var(--correct-color);
      }

      .message-incorrect {
        color: var(--primary-color);
      }

      .message-info {
        color: var(--text-color);
      }

      /* Responsive Design */
      @media (max-width: 480px) {
        .game-container {
          padding: 1rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        #scrambled-word-display {
          font-size: 2rem;
        }

        .tile {
          width: 50px;
          height: 50px;
          font-size: 1.5rem;
        }

        .controls,
        .game-actions {
          flex-direction: column;
          gap: 12px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

          for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;

            tile.addEventListener("touchend", touchEnd);
          });

            container.addEventListener("drop", dragDropOnContainer);
          });
        }

        function dragStart(e) {
          if (e.target.classList.contains("hinted")) return;
          draggedTile = e.target;
          setTimeout(() => e.target.classList.add("dragging"), 0);
        }

        function dragEnd() {
          if (draggedTile) {
            draggedTile.classList.remove("dragging");
          }
          draggedTile = null;
        }

        function dragOver(e) {
          e.preventDefault();
        }

        function dragDropOnContainer(e) {
          e.preventDefault();
          const targetContainer = e.target.closest(
            ".tile-area-wrapper, .drop-area-wrapper"
          );
          if (targetContainer && draggedTile) {
            targetContainer.appendChild(draggedTile);
          }
        }

        function touchStart(e) {
            if (e.target.classList.contains("hinted")) return;
            draggedTile = e.target;

            initialX = e.touches[0].clientX;
            initialY = e.touches[0].clientY;

            draggedTile.classList.add("dragging");
            draggedTile.style.zIndex = 1000; // Bring to front
            e.preventDefault();
        }

        function touchMove(e) {
            if (!draggedTile) return;
            e.preventDefault();

            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;

            const dx = currentX - initialX;
            const dy = currentY - initialY;

            draggedTile.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        function touchEnd(e) {
            if (!draggedTile) return;
            
            draggedTile.classList.remove("dragging");
            draggedTile.style.transform = '';
            draggedTile.style.zIndex = ''; // Reset z-index

            const touch = e.changedTouches[0];
            // Temporarily hide the tile to find the element underneath
            draggedTile.style.visibility = 'hidden';
            const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
            draggedTile.style.visibility = 'visible';
            
            if (dropTarget) {
                const targetContainer = dropTarget.closest(".tile-area-wrapper, .drop-area-wrapper");
                if (targetContainer) {
                    if (dropTarget.classList.contains('tile') && dropTarget !== draggedTile) {
                        // Insert before the tile we are dropping on
                        dropTarget.parentElement.insertBefore(draggedTile, dropTarget);
                    } else {
                        targetContainer.appendChild(draggedTile);
                    }
                }
            }
            draggedTile = null;
        }

        function checkAnswer() {
          const userAnswerTiles = answerSlotsEl.querySelectorAll(".tile");

          if (userAnswerTiles.length !== currentWordData.tiles.length) {
            showMessage("कृपया सभी अक्षर भरें!", "incorrect");
            return;
          }

          let userAnswer = "";
          userAnswerTiles.forEach((tile) => {
            userAnswer += tile.textContent;
          });

          if (userAnswer === currentWordData.word) {
            score += 10;
            updateScore();
            showMessage("बहुत बढ़िया! सही जवाब!", "correct");
            successSound.play();
            checkBtn.disabled = true;
            setTimeout(() => {
              currentWordIndex++;
              loadWord();
            }, 1500);
          } else {
            showMessage("गलत! फिर से प्रयास करें।", "incorrect");
          }
        }

        function giveHint() {
          if (hintUsed || letterTilesEl.children.length === 0) return;

          const correctTileOrder = currentWordData.tiles;
          const currentAnswerTiles = Array.from(answerSlotsEl.children);
          const nextCorrectIndex = currentAnswerTiles.length;

          if (nextCorrectIndex >= correctTileOrder.length) return; // Already complete

          const nextCorrectTileText = correctTileOrder[nextCorrectIndex];

          // Find the correct tile in the source area
          const sourceTiles = Array.from(letterTilesEl.children);
          let tileToMove = null;
          for (const tile of sourceTiles) {
            if (tile.textContent === nextCorrectTileText) {
              tileToMove = tile;
              break;
            }
          }

          // Move the tile to the answer area
          if (tileToMove) {
            answerSlotsEl.appendChild(tileToMove);
            tileToMove.draggable = false;
            tileToMove.classList.add("hinted");
          }

          hintUsed = true;
          hintBtn.disabled = true;
        }

        function resetCurrentWord() {
          loadWord();
        }

        function updateScore() {
          scoreEl.textContent = `स्कोर: ${score}`;
        }



        function updateWordCounter() {
          wordCounterEl.textContent = `शब्द: ${currentWordIndex + 1} / ${
            shuffledWordList.length
          }`;
        }

        function showMessage(msg, type) {
          messageEl.textContent = msg;
          messageEl.className = `message-${type}`;
        }

        function endGame() {
          scrambledWordDisplayEl.textContent = "खेल समाप्त!";
          answerSlotsEl.innerHTML = "";
          letterTilesEl.innerHTML = "";
          messageEl.textContent = `आपका अंतिम स्कोर है: ${score}`;
          messageEl.className = "message-info";
          checkBtn.disabled = true;
          hintBtn.disabled = true;
          resetBtn.disabled = true;
        }

        // Event Listeners
        checkBtn.addEventListener("click", checkAnswer);
        hintBtn.addEventListener("click", giveHint);
        resetBtn.addEventListener("click", resetCurrentWord);
        newGameBtn.addEventListener("click", newGame);

        // Start the game
        newGame();
      });
    </script>
  </body>
</html>
