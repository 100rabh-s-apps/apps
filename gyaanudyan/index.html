<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyaan Udyan</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <h1>Gyaan Udyan</h1>
    </header>

    <main>
        <div class="tip-container">
            <div class="tip-card">
                <h2 id="tip-title"></h2>
                <button id="listen-tip-btn" class="listen-btn">
                    <i class="fas fa-play"></i>
                </button>
                <button id="stop-tts-btn" class="listen-btn" style="display: none;">
                    <i class="fas fa-stop"></i>
                </button>
                <div id="tip-explanation-container" style="display: none;">
                    <p id="tip-explanation"></p>
                    <button id="listen-explanation-btn" class="listen-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    <button id="stop-explation-tts-btn" class="listen-btn" style="display: none;">
                        <i class="fas fa-stop"></i>
                    </button>
                </div>
                <button id="toggle-explanation-btn">Tell Me More</button>
            </div>
        </div>

        <div class="navigation">
            <button id="prev-btn">Previous Tip</button>
            <button id="next-btn">Next Tip</button>
        </div>

        <div class="category-container">
            <h3>Categories</h3>
            <div id="category-buttons">
                <!-- Category buttons will be inserted here by JavaScript -->
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Gyaan Udyan</p>
    </footer>

    <script src="study_smart_tips.js"></script>
    <script src="friendship_sharing_tips.js"></script>
    <script src="feelings_self_care_tips.js"></script>
    <script src="home_responsibility_tips.js"></script>
    <script src="digital_safety_tips.js"></script>
    <script src="app.js"></script>
</body>
</html>
