<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tellers Adventure</title>

    <meta name="keywords" content="time game, clock game, kids, educational, learn time, analog clock, digital clock, puzzles">

    <meta property="twitter:description" content="Fun clock game for kids — tell time, solve puzzles, and master hours & minutes with interactive challenges! Learn to read analog and digital clocks.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', cursive;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }
        .bg-pattern {
            background-color: #87CEEB; /* Sky Blue */
            background-image:
                radial-gradient(white 15%, transparent 16%),
                radial-gradient(white 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }
        .feedback-animation {
            animation: pop-in 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4">

    <div id="game-container" class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-2xl p-6 md:p-8 text-center w-full max-w-4xl mx-auto relative">
        <a href="https://apps.100rabh.com/" class="absolute top-4 left-4 text-gray-600 hover:text-blue-500 text-sm md:text-base font-bold flex items-center" style="text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Back to all apps
        </a>
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl md:text-5xl text-blue-600">Time Tellers</h1>
            <div class="text-2xl md:text-3xl bg-yellow-400 text-white px-4 py-2 rounded-full shadow-lg">
                Score: <span id="score">0</span>
            </div>
        </header>

        <!-- Question Area -->
        <div id="question-area" class="mb-6">
            <p id="question-text" class="text-xl md:text-3xl text-gray-700 min-h-[4rem] flex items-center justify-center"></p>
        </div>

        <!-- Clocks Display -->
        <div id="clocks-container" class="flex justify-center items-center gap-4 md:gap-8 mb-6 flex-wrap">
             <div id="clock1-wrapper" class="flex flex-col items-center">
                <canvas id="clock1" width="250" height="250"></canvas>
                <span id="clock1-label" class="text-xl font-bold text-gray-600 mt-2"></span>
             </div>
             <div id="clock2-wrapper" class="flex flex-col items-center">
                <canvas id="clock2" width="250" height="250"></canvas>
                 <span id="clock2-label" class="text-xl font-bold text-gray-600 mt-2"></span>
             </div>
        </div>

        <!-- Answer Area -->
        <div id="answer-area" class="flex justify-center items-center gap-2 md:gap-4 flex-wrap">
            <div id="time-inputs">
                <input type="number" id="hours-input" min="1" max="12" placeholder="HH" class="w-24 h-24 text-4xl text-center border-4 border-blue-300 rounded-2xl focus:border-blue-500 focus:ring-0">
                <span class="text-4xl font-bold mx-2">:</span>
                <input type="number" id="minutes-input" min="0" max="59" placeholder="MM" class="w-24 h-24 text-4xl text-center border-4 border-blue-300 rounded-2xl focus:border-blue-500 focus:ring-0">
            </div>
            <div id="ampm-inputs" class="flex gap-2">
                 <button id="am-btn" class="w-24 h-24 text-4xl font-bold bg-orange-400 text-white rounded-2xl shadow-md hover:bg-orange-500 transition-transform transform hover:scale-105">AM</button>
                 <button id="pm-btn" class="w-24 h-24 text-4xl font-bold bg-indigo-500 text-white rounded-2xl shadow-md hover:bg-indigo-600 transition-transform transform hover:scale-105">PM</button>
            </div>
        </div>
        
        <!-- Feedback Display -->
        <div id="feedback" class="text-8xl mt-4 min-h-[100px] flex items-center justify-center"></div>

        <!-- Control Buttons -->
        <div id="controls" class="mt-6">
            <button id="submit-btn" class="bg-green-500 text-white text-3xl px-12 py-4 rounded-full shadow-lg hover:bg-green-600 transition-transform transform hover:scale-105">Check</button>
            <button id="next-btn" class="bg-blue-500 text-white text-3xl px-12 py-4 rounded-full shadow-lg hover:bg-blue-600 transition-transform transform hover:scale-105 hidden">Next</button>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const scoreEl = document.getElementById('score');
        const questionTextEl = document.getElementById('question-text');
        const clocksContainer = document.getElementById('clocks-container');
        const clock1Wrapper = document.getElementById('clock1-wrapper');
        const clock2Wrapper = document.getElementById('clock2-wrapper');
        const clock1Canvas = document.getElementById('clock1');
        const clock2Canvas = document.getElementById('clock2');
        const clock1Label = document.getElementById('clock1-label');
        const clock2Label = document.getElementById('clock2-label');
        const answerArea = document.getElementById('answer-area');
        const timeInputs = document.getElementById('time-inputs');
        const hoursInput = document.getElementById('hours-input');
        const minutesInput = document.getElementById('minutes-input');
        const ampmInputs = document.getElementById('ampm-inputs');
        const amBtn = document.getElementById('am-btn');
        const pmBtn = document.getElementById('pm-btn');
        const feedbackEl = document.getElementById('feedback');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const ctx1 = clock1Canvas.getContext('2d');
        const ctx2 = clock2Canvas.getContext('2d');

        // --- Game State ---
        let score = 0;
        let currentQuestion = null;
        let userAMPM = null;
        let count = 0;


        // --- Sound Effects ---
        const synth = new Tone.Synth().toDestination();
        const correctSound = () => {
            synth.triggerAttackRelease("C5", "8n", Tone.now());
            synth.triggerAttackRelease("E5", "8n", Tone.now() + 0.2);
            synth.triggerAttackRelease("G5", "8n", Tone.now() + 0.4);
        };
        const incorrectSound = () => {
            synth.triggerAttackRelease("C3", "4n");
        };

        // --- Clock Drawing Logic ---
        function drawClock(ctx, hour, minute) {
            const radius = ctx.canvas.width / 2;
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            
            ctx.save();
            ctx.translate(radius, radius);

            // Clock Face
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.95, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = radius * 0.05;
            ctx.stroke();

            // Center point
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();

            // Numbers
            ctx.font = radius * 0.15 + "px 'Fredoka One'";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            for (let num = 1; num <= 12; num++) {
                const ang = num * Math.PI / 6;
                ctx.rotate(ang);
                ctx.translate(0, -radius * 0.8);
                ctx.rotate(-ang);
                ctx.fillText(num.toString(), 0, 0);
                ctx.rotate(ang);
                ctx.translate(0, radius * 0.8);
                ctx.rotate(-ang);
            }

            // Hour Hand
            const hourAngle = (hour % 12 + minute / 60) * Math.PI / 6;
            drawHand(ctx, hourAngle, radius * 0.5, radius * 0.07, 'black');

            // Minute Hand
            const minuteAngle = (minute * Math.PI / 30);
            drawHand(ctx, minuteAngle, radius * 0.75, radius * 0.05, 'black');
            
            ctx.restore();
        }

        function drawHand(ctx, pos, length, width, color) {
            ctx.beginPath();
            ctx.lineWidth = width;
            ctx.lineCap = "round";
            ctx.strokeStyle = color;
            ctx.moveTo(0, 0);
            ctx.rotate(pos);
            ctx.lineTo(0, -length);
            ctx.stroke();
            ctx.rotate(-pos);
        }

        // --- Question Types ---
        const questionTypes = [
            'readClock', 'timeDifference', 'futureTime', 'elapsedTime', 
            'setClock', 'amPmChallenge', 'timeBeforeEvent'
        ];

        function generateQuestion() {
            resetUI();
            // const type = questionTypes[Math.floor(Math.random() * questionTypes.length)];
            const type = questionTypes[ count];
            count = (count + 1) % questionTypes.length;

            let h1, m1, h2, m2, durationH, durationM, question, answer;

            switch (type) {
                case 'readClock':
                    h1 = Math.floor(Math.random() * 12) + 1;
                    m1 = Math.floor(Math.random() * 12) * 5;
                    question = "What time is shown on the clock?";
                    answer = { h: h1, m: m1 };
                    drawClock(ctx1, h1, m1);
                    clock2Wrapper.style.display = 'none';
                    break;
                
                case 'timeDifference':
                    h1 = Math.floor(Math.random() * 11) + 1;
                    m1 = Math.floor(Math.random() * 12) * 5;
                    durationH = Math.floor(Math.random() * 4) + 1;
                    durationM = Math.floor(Math.random() * 11) * 5;
                    
                    let totalMins1 = h1 * 60 + m1;
                    let totalMins2 = totalMins1 + durationH * 60 + durationM;
                    h2 = Math.floor(totalMins2 / 60) % 12;
                    if (h2 === 0) h2 = 12;
                    m2 = totalMins2 % 60;
                    
                    question = "How much time has passed between Clock A and Clock B?";
                    answer = { h: durationH, m: durationM };
                    drawClock(ctx1, h1, m1);
                    clock1Label.textContent = "Clock A";
                    drawClock(ctx2, h2, m2);
                    clock2Label.textContent = "Clock B";
                    break;

                case 'futureTime':
                    h1 = Math.floor(Math.random() * 12) + 1;
                    m1 = Math.floor(Math.random() * 12) * 5;
                    durationH = Math.floor(Math.random() * 4) + 1;
                    durationM = Math.floor(Math.random() * 11) * 5;

                    let futureTotalMins = (h1 * 60 + m1) + (durationH * 60 + durationM);
                    let futureH = Math.floor(futureTotalMins / 60) % 12;
                    if (futureH === 0) futureH = 12;
                    let futureM = futureTotalMins % 60;
                    
                    question = `It is ${h1}:${String(m1).padStart(2, '0')}. What time will it be in ${durationH} hour(s) and ${durationM} minutes?`;
                    answer = { h: futureH, m: futureM };
                    drawClock(ctx1, h1, m1);
                    clock2Wrapper.style.display = 'none';
                    break;
                
                case 'elapsedTime':
                    h1 = Math.floor(Math.random() * 12) + 1;
                    m1 = Math.floor(Math.random() * 12) * 5;
                    durationM = (Math.floor(Math.random() * 10) + 2) * 5; // 10 to 55 minutes

                    let elapsedTotalMins = (h1 * 60 + m1) + durationM;
                    let elapsedH = Math.floor(elapsedTotalMins / 60) % 12;
                    if (elapsedH === 0) elapsedH = 12;
                    let elapsedM = elapsedTotalMins % 60;
                    
                    question = `You started your homework at ${h1}:${String(m1).padStart(2, '0')}. You worked for ${durationM} minutes. What time did you finish?`;
                    answer = { h: elapsedH, m: elapsedM };
                    drawClock(ctx1, h1, m1);
                    clock2Wrapper.style.display = 'none';
                    break;

                case 'setClock':
                    h1 = Math.floor(Math.random() * 12) + 1;
                    m1 = Math.floor(Math.random() * 12) * 5;
                    question = "What time is shown on the clock?";
                    answer = { h: h1, m: m1 };
                    drawClock(ctx1, h1, m1); // Show a clock with a time to be read
                    clock2Wrapper.style.display = 'none';
                    break;

                case 'amPmChallenge':
                    h1 = Math.floor(Math.random() * 12) + 13; // 13:00 to 24:00
                    m1 = Math.floor(Math.random() * 12) * 5;
                    let h12 = h1 % 12;
                    if(h12 === 0) h12 = 12;

                    question = `If the time is ${h1}:${String(m1).padStart(2, '0')} in 24-hour format, what is it in 12-hour format?`;
                    answer = { h: h12, m: m1, ampm: h1 >= 12 ? 'PM' : 'AM' };
                    timeInputs.style.display = 'flex';
                    ampmInputs.style.display = 'flex';
                    clocksContainer.style.display = 'none';
                    break;

                case 'timeBeforeEvent':
                    h2 = Math.floor(Math.random() * 12) + 1; // Event time
                    m2 = (Math.floor(Math.random() * 4)) * 15; // 0, 15, 30, 45
                    durationH = Math.floor(Math.random() * 2);
                    durationM = (Math.floor(Math.random() * 3) + 1) * 15; // 15, 30, 45

                    let eventTotalMins = h2 * 60 + m2;
                    let currentTotalMins = eventTotalMins - (durationH * 60 + durationM);
                    if (currentTotalMins < 0) currentTotalMins += 12 * 60;

                    h1 = Math.floor(currentTotalMins / 60);
                    if (h1 === 0) h1 = 12;
                    m1 = currentTotalMins % 60;

                    question = `The movie starts at ${h2}:${String(m2).padStart(2, '0')}. It is now ${h1}:${String(m1).padStart(2, '0')}. How long until the movie starts?`;
                    answer = { h: durationH, m: durationM };
                    drawClock(ctx1, h1, m1);
                    clock1Label.textContent = "Now";
                    drawClock(ctx2, h2, m2);
                    clock2Label.textContent = "Movie Time";
                    break;
            }

            questionTextEl.textContent = question;
            currentQuestion = { type, answer };
            
            // Adjust UI for question type
            if (type === 'amPmChallenge') {
                 clocksContainer.style.display = 'none';
                 timeInputs.style.display = 'flex';
                 ampmInputs.style.display = 'flex';
            } else {
                 clocksContainer.style.display = 'flex';
                 timeInputs.style.display = 'flex';
                 ampmInputs.style.display = 'none';
            }
        }
        
        function drawEmptyClock(ctx) {
            drawClock(ctx, 3, 45); // A static time
             const radius = ctx.canvas.width / 2;
             ctx.save();
             ctx.translate(radius, radius);
             // Clear hands by drawing a white circle over them
             ctx.beginPath();
             ctx.arc(0, 0, radius * 0.8, 0, 2 * Math.PI);
             ctx.fillStyle = 'white';
             ctx.fill();
             ctx.restore();
        }

        // --- Game Flow & UI ---
        function checkAnswer() {
            const userH = parseInt(hoursInput.value);
            const userM = parseInt(minutesInput.value);
            const { answer } = currentQuestion;

            let isCorrect = false;
            if (currentQuestion.type === 'amPmChallenge') {
                isCorrect = userH === answer.h && userM === answer.m && userAMPM === answer.ampm;
            } else {
                isCorrect = userH === answer.h && userM === answer.m;
            }
            
            feedbackEl.classList.add('feedback-animation');
            if (isCorrect) {
                feedbackEl.textContent = '✅';
                score++;
                scoreEl.textContent = score;
                correctSound();
            } else {
                feedbackEl.textContent = '❌';
                incorrectSound();
            }

            submitBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
            hoursInput.disabled = true;
            minutesInput.disabled = true;
            amBtn.disabled = true;
            pmBtn.disabled = true;
        }

        function resetUI() {
            feedbackEl.textContent = '';
            feedbackEl.classList.remove('feedback-animation');
            hoursInput.value = '';
            minutesInput.value = '';
            hoursInput.disabled = false;
            minutesInput.disabled = false;
            amBtn.disabled = false;
            pmBtn.disabled = false;
            userAMPM = null;

            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
            
            clock1Wrapper.style.display = 'flex';
            clock2Wrapper.style.display = 'flex';
            clock1Label.textContent = "";
            clock2Label.textContent = "";

            amBtn.classList.remove('ring-4', 'ring-blue-400');
            pmBtn.classList.remove('ring-4', 'ring-blue-400');
        }

        function handleAMPMClick(selection) {
            userAMPM = selection;
            if(selection === 'AM') {
                amBtn.classList.add('ring-4', 'ring-blue-400');
                pmBtn.classList.remove('ring-4', 'ring-blue-400');
            } else {
                pmBtn.classList.add('ring-4', 'ring-blue-400');
                amBtn.classList.remove('ring-4', 'ring-blue-400');
            }
        }
        
        // --- Event Listeners ---
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', generateQuestion);
        amBtn.addEventListener('click', () => handleAMPMClick('AM'));
        pmBtn.addEventListener('click', () => handleAMPMClick('PM'));
        
        // Let's start the game!
        window.onload = () => {
            generateQuestion();
        };

    </script>
</body>
</html>
