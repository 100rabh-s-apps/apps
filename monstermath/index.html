<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Monster Mash!</title>
    <meta name="description" content="A playful math game for kids! Answer simple arithmetic questions to mash the monster and score points. Great for practicing addition, subtraction, and more in a fun, interactive way.">
    <meta name="keywords" content="math game, kids math, arithmetic, addition, subtraction, multiplication, division, monster game, educational game">
    <link rel="canonical" href="https://apps.100rabh.com/monstermath/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/monstermath/">
    <meta property="og:title" content="Math Monster Mash!">
    <meta property="og:description" content="A playful math game for kids! Answer simple arithmetic questions to mash the monster and score points. Great for practicing addition, subtraction, and more in a fun, interactive way.">
    <meta property="og:image" content="https://apps.100rabh.com/monstermath/img/monster1.jpg"> <!-- Using one of the monster images as OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/monstermath/">
    <meta property="twitter:title" content="Math Monster Mash!">
    <meta property="twitter:description" content="A playful math game for kids! Answer simple arithmetic questions to mash the monster and score points. Great for practicing addition, subtraction, and more in a fun, interactive way.">
    <meta property="twitter:image" content="https://apps.100rabh.com/monstermath/img/monster1.jpg"> <!-- Using one of the monster images as Twitter image -->

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container" style="position: relative;">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #fff; background-color: #ff4d4f; padding: 5px 10px; border-radius: 5px; font-family: sans-serif; position: absolute; top: 10px; left: 10px; z-index: 1000;">&larr; Back to all apps</a>
        <h1>Math Monster Mash!</h1>
        <div class="score-area">
            Score: <span id="score">0</span>
        </div>
        <div class="operation-selection">
            <span class="selection-label">Practice:</span>
            <label class="checkbox-container">
                <input type="checkbox" id="op-add" value="add" checked>
                <span class="checkmark">+</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="op-subtract" value="subtract" checked>
                <span class="checkmark">-</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="op-multiply" value="multiply" checked>
                <span class="checkmark">x</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="op-divide" value="divide" checked>
                <span class="checkmark">÷</span>
            </label>
        </div>
        <div class="monster-arena">
            <img id="monster" src="img/monster1.jpg" alt="Monster">
        </div>

        <div class="problem-area">
            <span id="question">What is 5 + 3?</span>
        </div>

        <div class="answer-options" id="mcq-options">
            <button class="answer-btn" data-value="0">0</button>
            <button class="answer-btn" data-value="0">0</button>
            <button class="answer-btn" data-value="0">0</button>
            <button class="answer-btn" data-value="0">0</button>
        </div>

        <div class="advanced-input-area hidden" id="advanced-input-area">
            <input type="number" id="user-answer-input" class="user-answer-input" placeholder="Your Answer" inputmode="numeric" pattern="[0-9]*">
            <button id="submit-answer-btn" class="action-button">Submit</button>
        </div>

        <button id="start-button" class="action-button">Start Game!</button>
        <button id="restart-button" class="action-button hidden">Play Again?</button>
        <button id="toggle-mode-button" class="action-button">Switch to Advanced Mode</button>
    </div>

    <script src="script.js"></script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</body>

</html>
