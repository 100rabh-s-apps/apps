<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unscramble Science</title>
    <meta name="description" content="Unscramble the letters to form a science-related word. A fun game to test your knowledge of scientific terms and improve your vocabulary.">
    <meta name="keywords" content="unscramble, science, game, vocabulary, educational, scientific terms, quiz">
    <link rel="canonical" href="https://apps.100rabh.com/unscramblescience/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://apps.100rabh.com/unscramblescience/">
    <meta property="og:title" content="Unscramble Science">
    <meta property="og:description" content="Unscramble the letters to form a science-related word. A fun game to test your knowledge of scientific terms and improve your vocabulary.">
    <meta property="og:image" content="https://apps.100rabh.com/unscramblescience/og-image.png"> <!-- Using og-image.png as OG image -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://apps.100rabh.com/unscramblescience/">
    <meta property="twitter:title" content="Unscramble Science">
    <meta property="twitter:description" content="Unscramble the letters to form a science-related word. A fun game to test your knowledge of scientific terms and improve your vocabulary.">
    <meta property="twitter:image" content="https://apps.100rabh.com/unscramblescience/og-image.png"> <!-- Using og-image.png as Twitter image -->

    <link rel="stylesheet" href="style.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a00606cf-530c-403b-92af-a924309041e9"></script>
</head>
<body>
    <div id="start-container">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #333; font-family: sans-serif; font-size: 0.9em; position: absolute; top: 15px; left: 15px;">&larr; Back to all apps</a>
        <h2>Welcome to Unscramble Science!</h2>
        <p>Unscramble the letters to form a scientific term. Drag and drop the letter tiles into the box and click "Check" to see if you're right. Good luck!</p>
        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-container" class="hidden">
        <a href="https://apps.100rabh.com/" style="text-decoration: none; color: #333; font-family: sans-serif; font-size: 0.9em; position: absolute; top: 15px; left: 15px;">&larr; Back to all apps</a>
        <div id="score-container">Score: <span id="score">0</span></div>
        <h1>Unscramble Science</h1>
        <div id="hint-container">
            <p id="hint-text"></p>
        </div>
        <div id="drop-zone" class="drop-zone"></div>
        <div id="scrambled-letters" class="letter-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="check-btn">Check</button>
        <button id="next-btn">Next Word</button>
        <button id="reset-btn">Reset Game</button>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
